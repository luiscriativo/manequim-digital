<meta charset="utf-8">
<title>Ateliê de Noivas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;1,6..96,500&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: uma coluna de celular centralizada; croqui do vestido como peça central; fita métrica como barra de progresso */
:root{
  --bg:#F6F2F4; --surface:#FFFFFF; --ink:#2A1F2B; --muted:#77697A; --line:#E5DCE2;
  --accent:#8C2F5A; --accent-ink:#FFFFFF; --accent-soft:#F3E3EB;
  --done:#3E8C69; --done-soft:#E2F1EA; --doing:#C4861A; --doing-soft:#FAEFD9;
  --block:#C0403A; --block-soft:#F8E0DE; --todo:#DCD3D9; --tape:#F6E7A8; --tick:rgba(42,31,43,.38);
  --display:'Bodoni Moda','Didot','Bodoni 72',Georgia,serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161118; --surface:#211A24; --ink:#F2EAF0; --muted:#A898A7; --line:#3A2F3D;
  --accent:#E27CA8; --accent-ink:#1E1420; --accent-soft:#3B2331;
  --done:#5BBE91; --done-soft:#1F3229; --doing:#E7AC46; --doing-soft:#3A2E17;
  --block:#EF6B61; --block-soft:#3D1F1D; --todo:#4A3F4D; --tape:#5A4E2A; --tick:rgba(242,234,240,.4);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161118; --surface:#211A24; --ink:#F2EAF0; --muted:#A898A7; --line:#3A2F3D;
  --accent:#E27CA8; --accent-ink:#1E1420; --accent-soft:#3B2331;
  --done:#5BBE91; --done-soft:#1F3229; --doing:#E7AC46; --doing-soft:#3A2E17;
  --block:#EF6B61; --block-soft:#3D1F1D; --todo:#4A3F4D; --tape:#5A4E2A; --tick:rgba(242,234,240,.4);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 96px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}

.app{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.proto{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;padding-top:10px;letter-spacing:.02em}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:.01em}
.brand i{font-style:italic;font-weight:500;color:var(--accent)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{padding:6px 11px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.h1{font-family:var(--display);font-size:34px;font-weight:500;line-height:1.08}
.h1 em{font-style:italic;color:var(--accent)}
.h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:8px}
.h2 .n{font-family:var(--mono);font-weight:500;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 7px;font-size:11px;letter-spacing:0}
.section{display:flex;flex-direction:column;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* cartões de trabalho */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.card:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.card-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card h3{font-size:16px;font-weight:600;line-height:1.25}
.card .sub{font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--accent-soft);color:var(--accent)}
.pill.done{background:var(--done-soft);color:var(--done)}
.pill.doing{background:var(--doing-soft);color:var(--doing)}
.pill.block{background:var(--block-soft);color:var(--block)}
.pill.todo,.pill.na{background:color-mix(in srgb,var(--todo) 45%,transparent);color:var(--muted)}
.prazo{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.prazo.urg{color:var(--block);font-weight:500}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:3px;background:var(--todo)}
.dot.done{background:var(--done)} .dot.doing{background:var(--doing)}
.dot.block{background:repeating-linear-gradient(45deg,var(--block) 0 2px,var(--block-soft) 2px 4px)}

/* fita métrica */
.tape-wrap{display:flex;align-items:center;gap:10px}
.tape{position:relative;flex:1;height:14px;border-radius:3px;background:var(--tape);overflow:hidden}
.tape>span{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.tape::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,var(--tick) 0 1px,transparent 1px 10%) 0 0/100% 100% no-repeat,
             repeating-linear-gradient(90deg,var(--tick) 0 1px,transparent 1px 2%) 0 100%/100% 45% no-repeat}
.pct{font-family:var(--mono);font-size:13px;font-weight:500;min-width:3.2em;text-align:right;font-variant-numeric:tabular-nums}

/* faixa do desfile */
.desfile{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;width:100%}
.desfile .big{font-family:var(--display);font-size:46px;line-height:1;font-weight:500}
.desfile .row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.desfile .lbl{font-size:12px;opacity:.75}
.desfile .tape{background:color-mix(in srgb,var(--tape) 80%,var(--ink))}

/* bloqueios */
.blk{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:start;background:var(--block-soft);border-radius:var(--r);padding:12px 14px;text-align:left;width:100%}
.blk .ico{grid-row:span 2;width:28px;height:28px;border-radius:8px;background:repeating-linear-gradient(45deg,var(--block) 0 3px,transparent 3px 6px);border:1.5px solid var(--block)}
.blk b{font-weight:600}
.blk .d{font-family:var(--mono);font-size:12px;color:var(--block);white-space:nowrap}
.blk .x{grid-column:2/4;font-size:13px;color:var(--muted)}

/* filtros */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* detalhe */
.back{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--accent);font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.croqui-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 10px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative}
.croqui-box .tools{position:absolute;top:10px;right:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:9px 14px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--block);border-color:color-mix(in srgb,var(--block) 45%,var(--line))}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hint{font-size:12.5px;color:var(--muted);text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .dot{display:inline-block}

svg.croqui{width:min(240px,70%);height:auto;overflow:visible}
svg.croqui.mini{width:100%;max-width:90px}
.z{stroke:var(--ink);stroke-width:1.1;stroke-linejoin:round;transition:fill .2s,opacity .2s}
.z.done{fill:var(--done)} .z.doing{fill:var(--doing)} .z.todo{fill:var(--todo)}
.z.block{fill:url(#hatch)}
.z.na{fill:transparent;stroke:var(--muted);stroke-dasharray:3 3;opacity:.55}
.z.veu{fill-opacity:.55}
svg.croqui.live .z{cursor:pointer}
svg.croqui.live .z:hover{stroke-width:2.4;stroke:var(--accent)}
svg.croqui .z:focus-visible{outline:none;stroke:var(--accent);stroke-width:3}
.z.pick{fill:var(--accent);fill-opacity:.8;stroke:var(--accent)}
.head{fill:var(--surface);stroke:var(--ink);stroke-width:1.1}

.parts{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.part{display:grid;grid-template-columns:12px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);text-align:left;width:100%}
.part:first-child{border-top:0}
.part .dot{width:12px;height:12px}
.part .nm{font-weight:600}
.part .st{font-size:12.5px;color:var(--muted)}
.part .cnt{font-family:var(--mono);font-size:12px;color:var(--muted)}
.part.off{opacity:.5}
.add-row{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.add-row input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px}

.hist{display:flex;flex-direction:column;gap:8px;font-size:13px}
.hist div{display:grid;grid-template-columns:52px 1fr;gap:10px}
.hist .mono{color:var(--muted);font-size:12px}

/* painel */
.looks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.look{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.look .nm{font-size:12.5px;font-weight:600;line-height:1.2}
.look .pct{min-width:0;text-align:center;font-size:12px}
.look.b{border-color:color-mix(in srgb,var(--block) 55%,var(--line))}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi b{display:block;font-family:var(--display);font-size:28px;font-weight:500;line-height:1}
.kpi span{font-size:12px;color:var(--muted)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 14px}
.list li{padding:10px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;font-size:14px}
.list li:first-child{border-top:0}
.list ul{list-style:none;margin:0;padding:0}
.note{font-size:12.5px;color:var(--muted);background:var(--accent-soft);border-radius:10px;padding:10px 12px}

/* navegação inferior */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:440px;margin:0 auto;display:flex;justify-content:space-around;align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);padding:6px 10px;border-radius:10px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}
.tab.plus{background:var(--accent);color:var(--accent-ink);border-radius:999px;width:46px;height:46px;justify-content:center;padding:0}
.tab.plus svg{width:24px;height:24px;stroke-width:2.2}

/* bottom sheet */
.sheet-wrap{position:fixed;inset:0;z-index:20;background:rgba(20,12,20,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;
  padding:8px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:16px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 0}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sheet-head h2{font-family:var(--display);font-size:28px;font-weight:500;line-height:1.1}
.x-btn{width:34px;height:34px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:18px;line-height:1;flex:none}
.steps{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.step{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;text-align:left}
.step:first-child{border-top:0}
.step .ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--todo);flex:none;display:grid;place-items:center}
.step.f .ck{border-color:var(--doing);background:linear-gradient(90deg,var(--doing) 50%,transparent 50%)}
.step.ok .ck{border-color:var(--done);background:var(--done)}
.step.ok .ck::after{content:"";width:9px;height:5px;border:2px solid var(--surface);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.step .t{flex:1;min-width:0}
.step.ok .t{color:var(--muted)}
.step .s{font-size:12px;color:var(--muted)}
.step .del{color:var(--muted);font-size:18px;padding:0 4px}
.steps-row{display:flex;align-items:stretch}
.steps-row .step{flex:1}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1}
.blkcard{background:var(--block-soft);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.blkcard b{color:var(--block)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;width:100%}
.fotos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.fotos img{aspect-ratio:1;object-fit:cover;border-radius:8px;width:100%;max-width:100%}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.foot{display:flex;justify-content:center}
.link{color:var(--muted);font-size:12.5px;text-decoration:underline;text-underline-offset:3px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" style="fill:var(--block-soft)"></rect>
      <rect width="3" height="6" style="fill:var(--block)"></rect>
    </pattern>
  </defs>
</svg>

<div class="app">
  <p class="proto">PROTÓTIPO · dados de exemplo · tudo fica salvo só neste navegador</p>
  <header class="top">
    <div class="brand">Ateliê <i>de noivas</i></div>
    <div class="seg" role="group" aria-label="Quem está usando">
      <button id="m-atelie" data-act="modo" data-v="atelie">Ateliê</button>
      <button id="m-dona" data-act="modo" data-v="dona">Visão da dona</button>
    </div>
  </header>
  <main id="view" class="stack" style="gap:22px"></main>
</div>

<nav class="tabs" aria-label="Navegação"><div class="tabs-in" id="tabs"></div></nav>
<div class="sheet-wrap" id="sheetWrap" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
const TODAY = new Date(2026, 9, 19);
const DESFILE = { nome: 'Desfile 2026', data: '2026-12-12' };
const ETAPAS = ['Talhar', 'Alinhavar', 'Prova', 'Costurar', 'Acabamento'];
const ZONAS = [
  { k: 'veu', n: 'Véu' }, { k: 'decote', n: 'Decote' }, { k: 'mangas', n: 'Mangas' },
  { k: 'corpete', n: 'Corpete' }, { k: 'cintura', n: 'Cintura' }, { k: 'saia', n: 'Saia' },
  { k: 'barra', n: 'Barra' }, { k: 'cauda', n: 'Cauda' }
];
// ordem de desenho: o que fica atrás primeiro
const PATHS = [
  ['cauda', 'M36 306 Q100 318 164 306 L188 330 Q100 344 12 330 Z'],
  ['veu', 'M90 24 Q100 6 110 24 L158 212 Q100 198 42 212 Z'],
  ['saia', 'M81 134 Q100 139 119 134 L160 290 Q100 301 40 290 Z'],
  ['barra', 'M40 290 Q100 301 160 290 L164 306 Q100 318 36 306 Z'],
  ['cintura', 'M82 120 Q100 125 118 120 L119 134 Q100 139 81 134 Z'],
  ['corpete', 'M76 75 Q100 84 124 75 L118 120 Q100 125 82 120 Z'],
  ['decote', 'M79 58 Q100 51 121 58 L124 75 Q100 84 76 75 Z'],
  ['mangas', 'M79 58 L63 62 L47 122 L58 126 L76 78 Z'],
  ['mangas', 'M121 58 L137 62 L153 122 L142 126 L124 78 Z']
];
const ST_LABEL = { done: 'Pronto', doing: 'Em andamento', block: 'Bloqueado', todo: 'Não começou', na: 'Não se aplica' };
const S_LABEL = { p: 'Pendente', f: 'Fazendo', ok: 'Feito' };
const MOTIVOS = ['Falta material', 'Aguardando cliente', 'Aguardando decisão', 'Outro'];
const KEY = 'atelie-proto-v1';

/* ---------- dados de exemplo ---------- */
function seed() {
  const E = arr => ETAPAS.map((t, i) => ({ t, s: arr[i] || 'p' }));
  const L = list => list.map(([t, s]) => ({ t, s }));
  const Z = (etapas, bloqueio = null) => ({ on: true, etapas, bloqueio, fotos: [] });
  const mk = (t) => {
    ZONAS.forEach(z => { if (!t.zonas[z.k]) t.zonas[z.k] = { on: false, etapas: [], bloqueio: null, fotos: [] }; });
    t.extras = (t.extras || []).map((x, i) => ({ k: 'x' + i, n: x.n, ...Z(x.etapas, x.bloqueio || null) }));
    t.hist = t.hist || [];
    return t;
  };
  return [
    mk({ id: 'look07', tipo: 'Confecção', nome: 'Look 07 · Sereia em renda', cliente: 'Peça do desfile', colecao: DESFILE.nome, prazo: '2026-12-01',
      zonas: {
        veu: Z(E(['ok', 'ok', 'ok', 'ok', 'ok'])), decote: Z(E(['ok', 'ok', 'ok', 'f'])), corpete: Z(E(['ok', 'ok', 'ok', 'f'])),
        mangas: Z(E(['ok']), { motivo: 'Falta material', detalhe: 'Renda chantilly marfim, 2 m', desde: '2026-10-14' }),
        cintura: Z(E(['ok', 'ok', 'ok', 'ok', 'f'])), saia: Z(E(['f'])), barra: Z(E([])), cauda: Z(E([]))
      },
      extras: [{ n: 'Bordado de pérolas', etapas: L([['Riscar desenho', 'ok'], ['Bordar frente', 'f'], ['Bordar costas', 'p']]) },
               { n: 'Forro', etapas: L([['Talhar', 'ok'], ['Costurar', 'ok']]) }],
      hist: [{ d: '2026-10-18', x: 'Cintura: acabamento começou' }, { d: '2026-10-16', x: 'Decote: prova aprovada' }, { d: '2026-10-14', x: 'Mangas bloqueadas: falta renda chantilly' }] }),

/* ---------- estado ---------- */
let S = { modo: 'atelie', view: 'hoje', cur: null, filtro: 'Todos', editPartes: false, sheet: null };
let T = load() || seed();
function load() { try { const v = JSON.parse(localStorage.getItem(KEY)); return Array.isArray(v) ? v : null; } catch (e) { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(T)); } catch (e) { /* sem armazenamento: segue só em memória */ } }

/* ---------- utilidades ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const days = (a, b) => Math.round((b - a) / 864e5);
const ddmm = s => pd(s).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
const isoToday = () => '2026-10-19';
const byId = id => T.find(t => t.id === id);
function parts(t) { return [...ZONAS.map(z => ({ ...t.zonas[z.k], k: z.k, n: z.n, extra: false })), ...t.extras.map(x => ({ ...x, extra: true }))]; }
function getPart(t, k) { return t.zonas[k] || t.extras.find(x => x.k === k); }
function partName(t, k) { const z = ZONAS.find(z => z.k === k); return z ? z.n : getPart(t, k).n; }
function st(p) {
  if (!p.on) return 'na';
  if (p.bloqueio) return 'block';
  if (p.etapas.length && p.etapas.every(e => e.s === 'ok')) return 'done';
  if (p.etapas.some(e => e.s !== 'p')) return 'doing';
  return 'todo';
}
function prog(t) {
  let tot = 0, got = 0;
  parts(t).filter(p => p.on).forEach(p => p.etapas.forEach(e => { tot++; got += e.s === 'ok' ? 1 : e.s === 'f' ? .5 : 0; }));
  return tot ? Math.round(got / tot * 100) : 0;
}
const blocks = t => parts(t).filter(p => p.on && p.bloqueio);
function prazoTxt(s) {
  const n = days(TODAY, pd(s));
  const txt = n < 0 ? `atrasado ${-n} d` : n === 0 ? 'hoje' : n === 1 ? 'amanhã' : `em ${n} dias`;
  return `<span class="prazo ${n <= 3 ? 'urg' : ''}">${ddmm(s)} · ${txt}</span>`;
}
const tape = p => `<div class="tape-wrap"><div class="tape" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><span style="width:${p}%"></span></div><span class="pct">${p}%</span></div>`;
const tipoPill = t => `<span class="pill">${esc(t.tipo)}</span>`;
function log(t, x) { t.hist.unshift({ d: isoToday(), x }); }
function toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => el.hidden = true, 1800); }
const RO = () => S.modo === 'dona';

/* ---------- croqui ---------- */
function croqui(t, { mini = false, live = false, picks = null } = {}) {
  const shapes = PATHS.map(([k, d]) => {
    const p = t ? t.zonas[k] : null;
    let cls = picks ? (picks.has(k) ? 'pick' : 'na') : st(p);
    const act = live ? `data-act="${picks ? 'novo-zona' : 'zona'}" data-k="${k}" tabindex="0" role="button" aria-label="${partName(t || { zonas: {}, extras: [] }, k)}"` : '';
    return `<path class="z ${cls} ${k === 'veu' ? 'veu' : ''}" d="${d}" ${act}><title>${ZONAS.find(z => z.k === k).n}${!picks && p ? ' · ' + ST_LABEL[cls] : ''}</title></path>`;
  }).join('');
  return `<svg class="croqui ${mini ? 'mini' : ''} ${live ? 'live' : ''}" viewBox="0 0 200 344" aria-hidden="${live ? 'false' : 'true'}">
    ${shapes}<rect class="head" x="96" y="44" width="8" height="12" rx="2"></rect><circle class="head" cx="100" cy="33" r="12"></circle></svg>`;
}
function dots(t) { return `<div class="dots" aria-hidden="true">${parts(t).filter(p => p.on).map(p => `<span class="dot ${st(p)}" title="${esc(p.n)}"></span>`).join('')}</div>`; }

function card(t) {
  const b = blocks(t).length;
  return `<button class="card" data-act="abrir" data-id="${t.id}">
    <div class="card-row"><div class="stack" style="gap:2px;min-width:0"><h3>${esc(t.nome)}</h3><span class="sub">${esc(t.cliente)}</span></div>${tipoPill(t)}</div>
    ${tape(prog(t))}
    <div class="card-row" style="align-items:center">${dots(t)}<div style="display:flex;gap:8px;align-items:center">${b ? `<span class="pill block">${b} bloqueio${b > 1 ? 's' : ''}</span>` : ''}${prazoTxt(t.prazo)}</div></div>
  </button>`;
}
function blkRow(t, p) {
  const d = days(pd(p.bloqueio.desde), TODAY);
  return `<button class="blk" data-act="abrir-zona" data-id="${t.id}" data-k="${p.k}">
    <span class="ico" aria-hidden="true"></span><b>${esc(t.nome.split(' · ')[0])} · ${esc(p.n)}</b><span class="d">${d} dia${d === 1 ? '' : 's'} parado</span>
    <span class="x">${esc(p.bloqueio.motivo)}: ${esc(p.bloqueio.detalhe)}</span></button>`;
}
function desfileStats() {
  const looks = T.filter(t => t.colecao === DESFILE.nome);
  const pct = looks.length ? Math.round(looks.reduce((a, t) => a + prog(t), 0) / looks.length) : 0;
  return { looks, pct, faltam: days(TODAY, pd(DESFILE.data)), bl: looks.reduce((a, t) => a + blocks(t).length, 0) };
}
function desfileBand() {
  const s = desfileStats();
  return `<button class="desfile" data-act="ir" data-v="painel">
    <div class="row"><div><div class="lbl">${DESFILE.nome} · ${ddmm(DESFILE.data)} (data de exemplo)</div><div class="big">${s.faltam} <span style="font-size:18px;font-family:var(--body)">dias</span></div></div>
    <div style="text-align:right" class="lbl">${s.looks.length} looks<br>${s.bl} bloqueio${s.bl === 1 ? '' : 's'}</div></div>
    ${tape(s.pct)}</button>`;
}

/* ---------- telas ---------- */
function vHoje() {
  const dt = TODAY.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
  const bl = T.flatMap(t => blocks(t).map(p => [t, p]));

  const andamento = T.filter(t => !semana.includes(t) && prog(t) < 100).sort((a, b) => a.prazo.localeCompare(b.prazo));
  return `<div class="stack" style="gap:4px"><span class="eyebrow">${dt}</span><h1 class="h1">Bom dia. <em>${bl.length} coisa${bl.length === 1 ? '' : 's'}</em> travada${bl.length === 1 ? '' : 's'} hoje.</h1></div>
  ${desfileBand()}
  ${bl.length ? `<section class="section"><h2 class="h2">Travado <span class="n">${bl.length}</span></h2>${bl.map(([t, p]) => blkRow(t, p)).join('')}</section>` : ''}
  <section class="section"><h2 class="h2">Prazos dos próximos dias <span class="n">${semana.length}</span></h2>${semana.map(card).join('') || '<p class="muted small">Nada vencendo nos próximos 10 dias.</p>'}</section>
  <section class="section"><h2 class="h2">Em andamento <span class="n">${andamento.length}</span></h2>${andamento.map(card).join('')}</section>

}
function vTrabalhos() {

  document.getElementById('view').innerHTML = v;
  const tabs = RO() ? ['painel', 'trabalhos'] : ['hoje', 'trabalhos', 'plus', 'painel'];
  const lbl = { hoje: 'Hoje', trabalhos: 'Trabalhos', painel: 'Painel' };
  const cur = S.view === 'detalhe' ? S.from : S.view;
  document.getElementById('tabs').innerHTML = tabs.map(k => k === 'plus'
    ? `<button class="tab plus" data-act="novo" aria-label="Novo trabalho">${ICON.plus}</button>`
    : `<button class="tab" data-act="ir" data-v="${k}" ${cur === k ? 'aria-current="page"' : ''}>${ICON[k]}${lbl[k]}</button>`).join('');
  renderSheet();
}

/* ---------- ações ---------- */
function go(view) { S.view = view; S.editPartes = false; S.sheet = null; render(); window.scrollTo(0, 0); }
function cycle(s) { return s === 'p' ? 'f' : s === 'f' ? 'ok' : 'p'; }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) {
    if (e.target.id === 'sheetWrap') { S.sheet = null; renderSheet(); }
    return;
  }
  const a = el.dataset.act, t = S.cur ? byId(S.cur) : null;
  switch (a) {
    case 'modo': S.modo = el.dataset.v; S.sheet = null; S.editPartes = false; if (S.view !== 'detalhe') S.view = RO() ? 'painel' : 'hoje'; render(); break;
    case 'ir': go(el.dataset.v); break;
    case 'filtro': S.filtro = el.dataset.v; render(); break;
    case 'abrir': S.from = S.view === 'detalhe' ? S.from : S.view; S.cur = el.dataset.id; go('detalhe'); break;
    case 'abrir-zona': S.from = S.view; S.cur = el.dataset.id; go('detalhe'); S.sheet = { type: 'zona', k: el.dataset.k }; renderSheet(); break;
    case 'voltar': go(S.from || 'hoje'); break;
    case 'edit-partes': S.editPartes = !S.editPartes; render(); break;
    case 'zona':
      if (S.editPartes && !RO()) { togglePart(t, el.dataset.k); break; }
      if (!getPart(t, el.dataset.k).on) { toast('Essa parte não se aplica a este vestido'); break; }
      S.sheet = { type: 'zona', k: el.dataset.k }; renderSheet(); break;
    case 'toggle-parte': togglePart(t, el.dataset.k); break;
    case 'fechar': S.sheet = null; render(); break;
    case 'etapa': { const p = getPart(t, S.sheet.k), et = p.etapas[+el.dataset.i]; et.s = cycle(et.s);
      if (et.s !== 'p') log(t, `${partName(t, S.sheet.k)}: ${et.t.toLowerCase()} ${et.s === 'ok' ? 'feito' : 'começou'}`);
      save(); renderSheet(); break; }
    case 'del-etapa': getPart(t, S.sheet.k).etapas.splice(+el.dataset.i, 1); save(); renderSheet(); break;
    case 'bloquear': S.sheet.bloquear = true; S.sheet.motivo = 'Falta material'; renderSheet(); break;
    case 'motivo': S.sheet.motivo = el.dataset.v; el.parentElement.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === el)); break;
    case 'cancelar-bloq': S.sheet.bloquear = false; renderSheet(); break;
    case 'desbloquear': { const p = getPart(t, S.sheet.k); log(t, `${partName(t, S.sheet.k)} desbloqueada (${p.bloqueio.motivo.toLowerCase()})`); p.bloqueio = null; save(); toast('Desbloqueado'); renderSheet(); break; }
    case 'novo': S.sheet = { type: 'novo', tipo: 'Ajuste', zonas: new Set() }; renderSheet(); break;
    case 'novo-tipo': S.sheet.tipo = el.dataset.v; el.parentElement.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === el)); break;
    case 'novo-zona': { const k = el.dataset.k, z = S.sheet.zonas; z.has(k) ? z.delete(k) : z.add(k);
      document.querySelectorAll(`#sheet path[data-k="${k}"]`).forEach(p => { p.classList.toggle('pick', z.has(k)); p.classList.toggle('na', !z.has(k)); }); break; }
    case 'reset': try { localStorage.removeItem(KEY); } catch (er) {} T = seed(); go('hoje'); toast('Dados de exemplo restaurados'); break;
  }
  if (S.view === 'detalhe' && a !== 'zona' && a !== 'abrir' && a !== 'abrir-zona' && S.sheet) document.getElementById('view').innerHTML = vDetalhe();
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('path[data-act]')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
  if (e.key === 'Escape' && S.sheet) { S.sheet = null; render(); }
});
function togglePart(t, k) {
  const p = getPart(t, k); p.on = !p.on;
  if (p.on && !p.etapas.length) p.etapas = t.tipo === 'Ajuste' ? [{ t: 'Ajustar', s: 'p' }, { t: 'Prova', s: 'p' }] : ETAPAS.map(x => ({ t: x, s: 'p' }));
  save(); render();
}

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target.dataset.form, t = S.cur ? byId(S.cur) : null;
  if (f === 'etapa') { const v = document.getElementById('nova-etapa').value.trim(); if (!v) return; getPart(t, S.sheet.k).etapas.push({ t: v, s: 'p' }); save(); renderSheet(); document.getElementById('nova-etapa').focus(); }
  if (f === 'extra') { const v = document.getElementById('novo-extra').value.trim(); if (!v) return;
    t.extras.push({ k: 'x' + Date.now(), n: v, on: true, etapas: [{ t: 'Fazer', s: 'p' }], bloqueio: null, fotos: [] }); save(); render(); }
  if (f === 'bloqueio') { const v = document.getElementById('blk-det').value.trim(); if (!v) return;
    const p = getPart(t, S.sheet.k); p.bloqueio = { motivo: S.sheet.motivo, detalhe: v, desde: isoToday() };
    log(t, `${partName(t, S.sheet.k)} bloqueada: ${v}`); S.sheet.bloquear = false; save(); toast('Bloqueado. A dona vai ver no painel.'); render(); }
  if (f === 'novo') {
    const nome = document.getElementById('nv-nome').value.trim(); if (!nome) return;
    if (!S.sheet.zonas.size) { toast('Toque em pelo menos uma parte do vestido'); return; }
    const tipo = S.sheet.tipo, id = 'n' + Date.now();
    const zonas = {}; ZONAS.forEach(z => zonas[z.k] = { on: S.sheet.zonas.has(z.k), etapas: S.sheet.zonas.has(z.k) ? (tipo === 'Ajuste' ? [{ t: 'Ajustar', s: 'p' }, { t: 'Prova', s: 'p' }] : ETAPAS.map(x => ({ t: x, s: 'p' }))) : [], bloqueio: null, fotos: [] });
    T.push({ id, tipo, nome, cliente: document.getElementById('nv-cli').value.trim() || '—', prazo: document.getElementById('nv-prazo').value || '2026-10-30', zonas, extras: [], hist: [{ d: isoToday(), x: 'Trabalho criado' }] });
    save(); S.from = 'trabalhos'; S.cur = id; go('detalhe'); toast('Trabalho criado');
  }
});
document.addEventListener('change', e => {
  if (e.target.id !== 'foto-in' || !e.target.files[0]) return;
  const t = byId(S.cur), p = getPart(t, S.sheet.k), r = new FileReader();
  r.onload = () => { const img = new Image(); img.onload = () => {
    const sc = Math.min(1, 480 / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = img.width * sc; c.height = img.height * sc; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    p.fotos.push(c.toDataURL('image/jpeg', .7)); log(t, `${partName(t, S.sheet.k)}: foto adicionada`); save(); renderSheet(); toast('Foto adicionada'); };
    img.src = r.result; };
  r.readAsDataURL(e.target.files[0]);
});

render();
</script>
